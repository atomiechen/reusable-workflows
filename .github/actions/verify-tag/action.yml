name: Verify Tag 🏷️
description: Verify the input tag or fetch the latest tag, and checkout to that tag if requested.

inputs:
  tag:
    description: "Tag to verify (empty for fetching latest tag)"
    required: false
    default: ""
  checkout:
    description: "Whether to checkout to the verified or fetched tag (default: false)"
    required: false
    default: "false"
  tag_pattern:
    description: "Optional git tag glob used to select and validate product tags"
    required: false
    default: ""

outputs:
  tag:
    description: The tag that was verified or fetched
    value: ${{ steps.set_tag.outputs.tag }}

runs:
  using: "composite"
  steps:
    - name: Checkout code with all tags
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for all branches and tags
        persist-credentials: false
    - name: Verify and set output tag
      id: set_tag
      shell: bash
      env:
        REQUESTED_TAG: ${{ inputs.tag }}
        TAG_PATTERN: ${{ inputs.tag_pattern }}
      run: |
        bash "${{ github.action_path }}/resolve-tag.sh" "$REQUESTED_TAG" "$TAG_PATTERN" >> "$GITHUB_OUTPUT"
    - name: Checkout to specified tag
      if: ${{ inputs.checkout == 'true' }}
      shell: bash
      env:
        VERIFIED_TAG: ${{ steps.set_tag.outputs.tag }}
      run: |
        echo "Checking out to tag $VERIFIED_TAG"
        git checkout --detach "refs/tags/$VERIFIED_TAG"
