name: Publish Python 🐍 distributions 📦

on:
  workflow_call:
    inputs:
      publish_testpypi:
        type: boolean
        default: false
        description: Publish to TestPyPI
      publish_pypi:
        type: boolean
        default: false
        description: Publish to PyPI
      publish_gh_release:
        type: boolean
        default: true
        description: Publish to GitHub Release
      build_only:
        type: boolean
        default: false
        description: Build and validate artifacts without publishing in this workflow
      use_changelog:
        type: boolean
        default: true
        description: Extract release notes from CHANGELOG.md
      changelog_file:
        type: string
        default: CHANGELOG.md
        description: Path to changelog file
        required: false
      release_tag:
        type: string
        description: Tag to package (empty for latest tag)
        required: false
      package_dir:
        type: string
        default: .
        description: Directory where the Python package is located
    secrets:
      TEST_PYPI_API_TOKEN:
        description: TestPyPI API Token
        required: false
      PYPI_API_TOKEN:
        description: PyPI API Token
        required: false

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.set_release_tag.outputs.tag }}
    steps:
    - name: Validate release mode
      run: |
        if [[ ${{ inputs.build_only }} == true ]]; then
          if [[ ${{ inputs.publish_testpypi }} == true || ${{ inputs.publish_pypi }} == true || ${{ inputs.publish_gh_release }} == true ]]; then
            echo "build_only cannot be combined with publish targets."
            exit 1
          fi
        elif [[ ${{ inputs.publish_testpypi }} == false && ${{ inputs.publish_pypi }} == false && ${{ inputs.publish_gh_release }} == false ]]; then
          echo "All publish targets are disabled. Exiting workflow."
          exit 1
        fi
    - name: Verify and checkout to specified tag
      id: set_release_tag
      uses: atomiechen/reusable-workflows/.github/actions/verify-tag@dc0e552d0473b25ff8eccf3f32a97e26d17d5185
      with:
        tag: ${{ inputs.release_tag }}
        checkout: true
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install build and validation tools
      working-directory: ${{ inputs.package_dir }}
      run: >-
        python3 -m
        pip install
        build
        twine
        --user
    - name: Build a binary wheel and a source tarball
      working-directory: ${{ inputs.package_dir }}
      run: python3 -m build
    - name: Validate distribution metadata and long description
      working-directory: ${{ inputs.package_dir }}
      run: python3 -m twine check dist/*
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: ${{ inputs.package_dir }}/dist/
    - name: Store the changelog file
      if: ${{ inputs.use_changelog }}
      uses: actions/upload-artifact@v4
      with:
        name: changelog
        path: ${{ inputs.changelog_file }}

  publish-to-testpypi:
    name: Publish Python 🐍 distribution 📦 to TestPyPI
    if: ${{ inputs.publish_testpypi }}
    needs:
    - build
    runs-on: ubuntu-latest

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Require TestPyPI API token
      env:
        TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: |
        if [ -z "$TEST_PYPI_API_TOKEN" ]; then
          echo "TEST_PYPI_API_TOKEN is required for reusable-workflow TestPyPI publishing."
          exit 1
        fi
    - name: Publish distribution 📦 to TestPyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      with:
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        repository-url: https://test.pypi.org/legacy/
        verbose: true

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: ${{ inputs.publish_pypi }}
    needs:
    - build
    runs-on: ubuntu-latest

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Require PyPI API token
      env:
        PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        if [ -z "$PYPI_API_TOKEN" ]; then
          echo "PYPI_API_TOKEN is required for reusable-workflow PyPI publishing."
          exit 1
        fi
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        verbose: true

  github-release:
    name: >-
      Sign the Python 🐍 distribution 📦 with Sigstore
      and upload them to GitHub Release
    if: ${{ inputs.publish_gh_release }}
    needs:
    - build
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.0.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
    - name: Get repository name
      id: get_repo_name
      run: |
        repo_full_name=${{ github.repository }}
        repo_name=${repo_full_name#*/}
        echo "name=$repo_name" >> $GITHUB_OUTPUT
    - name: Download the changelog file
      if: ${{ inputs.use_changelog }}
      uses: actions/download-artifact@v4
      with:
        name: changelog
    - name: Extract release notes
      if: ${{ inputs.use_changelog }}
      id: extract-release-notes
      uses: ffurrer2/extract-release-notes@v2
      with:
        changelog_file: ${{ inputs.changelog_file }}
    - name: Create GitHub Release 📦
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/**
        tag_name: ${{ needs.build.outputs.release_tag }}
        name: ${{ steps.get_repo_name.outputs.name }} ${{ needs.build.outputs.release_tag }}
        body: |
          Release ${{ steps.get_repo_name.outputs.name }} ${{ needs.build.outputs.release_tag }}.

          ${{ steps.extract-release-notes.outputs.release_notes }}
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
