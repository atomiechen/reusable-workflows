name: Test reusable workflows

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/actions/verify-tag/test.sh
  npm-tarball-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g npm@latest
      - run: bash .github/tests/npm-tarball-path.sh
